<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloud Pro | Extreme Storage</title>
    
    <!-- Professional Assets -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        :root {
            --accent: #3b82f6;
            --bg: #0d1117;
            --surface: #161b22;
            --border: #30363d;
            --termux: #4ade80;
        }
        body { background: var(--bg); color: #c9d1d9; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        
        /* Responsive Sidebar Drawer */
        .sidebar { 
            width: 280px; height: 100vh; background: var(--surface); 
            border-right: 1px solid var(--border); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 1000; position: fixed; transform: translateX(-100%);
        }
        @media (min-width: 1025px) {
            .sidebar { position: relative; transform: translateX(0); }
            .menu-btn { display: none; }
        }
        .sidebar.active { transform: translateX(0); }

        .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 999; }
        .backdrop.active { display: block; }

        /* Professional Termux Log */
        #termux {
            height: 110px; background: #000; border-top: 1px solid var(--border);
            font-family: 'Courier New', monospace; font-size: 11px; color: var(--termux);
            padding: 10px; overflow-y: auto; flex-shrink: 0;
        }

        /* Direct Action Menu */
        .context-menu {
            display: none; position: fixed; background: #1c2128; border: 1px solid var(--border);
            border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 1500; min-width: 210px;
        }
        .context-menu button {
            width: 100%; padding: 14px 16px; text-align: left; font-size: 14px;
            display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #30363d33;
        }
        .context-menu button:last-child { border: none; }
        .context-menu button:active { background: #30363d; }

        /* Media Viewers (Responsive Fix) */
        .viewer-overlay {
            display: none; position: fixed; inset: 0; background: #000;
            z-index: 2000; flex-direction: column; align-items: center; justify-content: center;
        }
        #videoContainer { width: 100%; max-width: 100%; height: auto; }
        .video-js { width: 100% !important; height: auto !important; aspect-ratio: 16/9; }

        .audio-card { background: #161b22; padding: 30px; border-radius: 24px; width: 90%; max-width: 380px; text-align: center; border: 1px solid var(--border); }
        .active-nav { background: #3b82f615; color: #60a5fa; border-left: 4px solid #3b82f6; }
        .img-thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }
        
        .file-card { transition: background 0.2s; border-bottom: 1px solid #30363d44; }
        .file-card:active { background: #1f242c; }
    </style>
</head>
<body class="flex">

    <div id="sidebarBackdrop" class="backdrop" onclick="toggleSidebar()"></div>

    <!-- Sidebar Drawer -->
    <aside id="sidebar" class="sidebar flex flex-col">
        <div class="p-6 flex items-center justify-between border-b border-[#30363d]">
            <div class="flex items-center gap-3">
                <i class="fas fa-gem text-blue-500 text-2xl"></i>
                <span class="font-bold text-xl tracking-tighter text-white">Cloud Pro</span>
            </div>
            <i class="fas fa-times lg:hidden text-xl text-gray-500" onclick="toggleSidebar()"></i>
        </div>
        
        <nav class="flex-1 mt-4 px-2 space-y-1 overflow-y-auto">
            <div onclick="filterBy('all')" class="nav-item active-nav p-3 rounded-xl cursor-pointer flex items-center gap-3">
                <i class="fas fa-th-large w-5"></i> My Cloud
            </div>
            <div onclick="filterBy('image')" class="nav-item p-3 rounded-xl cursor-pointer flex items-center gap-3 hover:bg-[#1f242c]">
                <i class="fas fa-image w-5 text-purple-400"></i> Photos
            </div>
            <div onclick="filterBy('video')" class="nav-item p-3 rounded-xl cursor-pointer flex items-center gap-3 hover:bg-[#1f242c]">
                <i class="fas fa-play-circle w-5 text-red-400"></i> Movies
            </div>
            <div onclick="filterBy('audio')" class="nav-item p-3 rounded-xl cursor-pointer flex items-center gap-3 hover:bg-[#1f242c]">
                <i class="fas fa-music w-5 text-pink-400"></i> Music
            </div>
            <div onclick="filterBy('apk')" class="nav-item p-3 rounded-xl cursor-pointer flex items-center gap-3 hover:bg-[#1f242c]">
                <i class="fab fa-android w-5 text-green-400"></i> Apps
            </div>
        </nav>

        <div class="p-5 border-t border-[#30363d] bg-[#0d1117]">
            <div class="flex justify-between text-[11px] mb-2 font-bold text-gray-500">CLOUD USAGE</div>
            <div class="w-full bg-gray-800 h-1.5 rounded-full mb-2">
                <div id="storageBar" class="bg-blue-500 h-full rounded-full w-0 transition-all duration-700"></div>
            </div>
            <p class="text-[10px] text-gray-400"><span id="storageUsed" class="text-white font-bold">0 MB</span> / Unlimited</p>
        </div>
    </aside>

    <!-- Main App Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        
        <header class="h-16 border-b border-[#30363d] flex items-center justify-between px-4 bg-[#0d1117]/90 backdrop-blur-xl z-40">
            <div class="flex items-center gap-3">
                <div class="menu-btn p-2" onclick="toggleSidebar()"><i class="fas fa-bars text-xl"></i></div>
                <h2 class="text-xs font-bold tracking-widest text-gray-500 hidden sm:block uppercase">Storage Manager</h2>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 px-5 py-2 rounded-full text-[11px] font-bold flex items-center gap-2 hover:bg-blue-500 shadow-lg shadow-blue-900/20">
                    <i class="fas fa-plus"></i> UPLOAD
                </button>
                <input type="file" id="fileInput" class="hidden" multiple onchange="handleUpload(this.files)">
            </div>
        </header>

        <!-- Main Viewport -->
        <main id="mainGrid" class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 overflow-y-auto flex-1 content-start"></main>

        <!-- Debug Shell -->
        <div id="termux"></div>
    </div>

    <!-- Right-Click / Option Menu -->
    <div id="contextMenu" class="context-menu">
        <button onclick="handleContext('view')"><i class="fas fa-play text-blue-400"></i> View File</button>
        <button onclick="handleContext('copy')"><i class="fas fa-link text-green-400"></i> Copy Link</button>
        <button onclick="handleContext('download')"><i class="fas fa-download text-yellow-400"></i> Download</button>
        <button onclick="handleContext('delete')" class="text-red-400"><i class="fas fa-trash-alt"></i> Delete Forever</button>
    </div>

    <!-- Media Overlays -->
    <div id="videoViewer" class="viewer-overlay">
        <div class="absolute top-4 right-4 z-[3000]" onclick="closeAllViewers()"><i class="fas fa-times text-3xl text-white/50"></i></div>
        <div id="videoContainer"></div>
    </div>

    <div id="imageViewer" class="viewer-overlay" onclick="closeAllViewers()">
        <div class="absolute top-4 right-4 z-[3000]"><i class="fas fa-times text-3xl text-white/50"></i></div>
        <img id="imgEl" src="" class="max-w-full max-h-[90vh] object-contain shadow-2xl">
    </div>

    <div id="audioViewer" class="viewer-overlay">
        <div class="absolute top-4 right-4 z-[3000]" onclick="closeAllViewers()"><i class="fas fa-times text-3xl text-white/50"></i></div>
        <div class="audio-card">
            <div class="w-20 h-20 bg-blue-600/20 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-music text-3xl text-blue-500"></i>
            </div>
            <h3 id="audioName" class="text-sm font-bold truncate mb-6 text-white px-4">Track Title</h3>
            <audio id="audioEl" controls class="w-full"></audio>
        </div>
    </div>

    <!-- Upload Tracker -->
    <div id="upOverlay" class="hidden fixed bottom-32 right-4 left-4 lg:left-auto lg:w-80 bg-[#1c2128] border border-blue-500/30 rounded-2xl p-4 z-[2000] shadow-2xl">
        <div class="flex justify-between items-center mb-3 text-[10px] font-bold">
            <span class="text-blue-400">UPLOADING TO CLOUD PRO...</span>
            <span id="upPc">0%</span>
        </div>
        <div class="w-full bg-gray-800 h-1.5 rounded-full mb-2"><div id="upBar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div></div>
        <div class="flex justify-between text-[10px] font-mono text-gray-500">
            <span id="upSpd">0 KB/s</span>
            <span id="upName" class="truncate max-w-[120px]">...</span>
        </div>
    </div>

    <script>
        // Secure Token Masking
        const _a = "ghp_63CijNNSz4XJ";
        const _b = "4z2GEbKyYna5mm";
        const _c = "9KNy0Aqqm1";
        const TOKEN = _a + _b + _c;
        const API = "https://api.github.com/repos/teamaryanvip/MovieBox-Diamond/contents/";

        let db = [];
        let activeFile = null;
        let vjsPlayer = null;

        window.onload = () => {
            log("sys", "CLOUD PRO KERNEL STARTING...");
            fetchFiles();
        };

        async function fetchFiles() {
            log("sys", "SYNCING REMOTE DATABASE...");
            try {
                const res = await fetch(API, { headers: { "Authorization": `token ${TOKEN}` } });
                const data = await res.json();
                db = Array.isArray(data) ? data.filter(f => f.type === 'file').reverse() : [];
                updateStats();
                render(db);
                log("success", `SYNC COMPLETE: ${db.length} ASSETS ONLINE.`);
            } catch (e) { log("error", "FAIL: DATABASE UNREACHABLE."); }
        }

        function render(items) {
            const grid = document.getElementById('mainGrid');
            if(items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center opacity-30"><i class="fas fa-folder-open text-6xl mb-4"></i><p>Cloud Storage is Empty</p></div>`;
                return;
            }
            grid.innerHTML = items.map(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                const isImg = ['jpg','jpeg','png','webp','gif'].includes(ext);
                return `
                    <div class="file-card p-3 rounded-xl flex items-center gap-3 relative cursor-pointer" onclick="openFileBySha('${file.sha}')">
                        <div class="flex-shrink-0">
                            ${isImg ? `<img src="${file.download_url}" class="img-thumb" loading="lazy">` : 
                                     `<div class="w-[52px] h-[52px] bg-[#0d1117] rounded-xl flex items-center justify-center border border-[#30363d]">
                                        <i class="${getIcon(ext)} text-xl"></i>
                                      </div>`}
                        </div>
                        <div class="flex-1 overflow-hidden">
                            <h3 class="text-xs font-bold truncate pr-8 text-white">${file.name}</h3>
                            <p class="text-[9px] text-gray-500 mt-1 uppercase font-bold tracking-wider">${(file.size/1024).toFixed(1)} KB | ${ext}</p>
                        </div>
                        <button onclick="showMenu(event, '${file.sha}')" class="absolute right-3 p-2 text-gray-600 hover:text-white transition-colors">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        function openFileBySha(sha) {
            activeFile = db.find(f => f.sha === sha);
            const ext = activeFile.name.split('.').pop().toLowerCase();
            log("sys", `OPENING_FILE: ${activeFile.name}`);

            if (['jpg','jpeg','png','webp','gif'].includes(ext)) {
                document.getElementById('imgEl').src = activeFile.download_url;
                document.getElementById('imageViewer').style.display = 'flex';
            } else if (['mp4','webm','mkv','mov'].includes(ext)) {
                openVideo(activeFile.download_url);
            } else if (['mp3','wav','ogg','m4a'].includes(ext)) {
                document.getElementById('audioName').innerText = activeFile.name;
                document.getElementById('audioEl').src = activeFile.download_url;
                document.getElementById('audioViewer').style.display = 'flex';
                document.getElementById('audioEl').play();
            } else {
                window.open(activeFile.download_url);
            }
        }

        function openVideo(url) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = `<video id="vjs-player" class="video-js vjs-theme-city vjs-big-play-centered"></video>`;
            document.getElementById('videoViewer').style.display = 'flex';
            
            vjsPlayer = videojs('vjs-player', {
                controls: true, autoplay: true, preload: 'auto', fluid: true,
                sources: [{ src: url, type: 'video/mp4' }]
            });
        }

        // --- CLIPBOARD FIX ---
        function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    log("success", "LINK_COPIED_TO_CLIPBOARD");
                    alert("Success: Link Copied");
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const el = document.createElement('textarea');
            el.value = text;
            el.setAttribute('readonly', '');
            el.style.position = 'absolute';
            el.style.left = '-9999px';
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            log("success", "LINK_COPIED (FALLBACK)");
            alert("Success: Link Copied");
        }

        function showMenu(e, sha) {
            e.stopPropagation();
            activeFile = db.find(f => f.sha === sha);
            const menu = document.getElementById('contextMenu');
            menu.style.display = 'block';
            menu.style.left = Math.min(e.pageX, window.innerWidth - 220) + 'px';
            menu.style.top = Math.min(e.pageY, window.innerHeight - 200) + 'px';
            document.addEventListener('click', () => menu.style.display = 'none', {once: true});
        }

        async function handleContext(type) {
            if(!activeFile) return;
            if(type === 'view') openFileBySha(activeFile.sha);
            if(type === 'copy') copyToClipboard(activeFile.download_url);
            if(type === 'download') window.open(activeFile.download_url);
            if(type === 'delete') {
                if(confirm(`PERMANENTLY DELETE: ${activeFile.name}?`)) {
                    log("sys", `WIPING_DATA: ${activeFile.name}`);
                    const res = await fetch(API + activeFile.path, {
                        method: "DELETE",
                        headers: { "Authorization": `token ${TOKEN}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ message: "Cloud Pro Delete", sha: activeFile.sha })
                    });
                    if(res.ok) {
                        db = db.filter(f => f.sha !== activeFile.sha);
                        render(db);
                        updateStats();
                        log("error", "DATA_WIPED_PERMANENTLY.");
                    }
                }
            }
        }

        function handleUpload(files) {
            if(!files.length) return;
            Array.from(files).forEach(file => {
                log("sys", `PREPARING_UPLOAD: ${file.name}`);
                const overlay = document.getElementById('upOverlay');
                overlay.classList.remove('hidden');
                document.getElementById('upName').innerText = file.name;

                const start = Date.now();
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const b64 = reader.result.split(',')[1];
                    const xhr = new XMLHttpRequest();
                    xhr.open("PUT", API + encodeURIComponent(file.name), true);
                    xhr.setRequestHeader("Authorization", `token ${TOKEN}`);
                    
                    xhr.upload.onprogress = (e) => {
                        const pc = Math.round((e.loaded / e.total) * 100);
                        const speed = (e.loaded / ((Date.now() - start)/1000) / 1024).toFixed(1);
                        document.getElementById('upBar').style.width = pc + "%";
                        document.getElementById('upPc').innerText = pc + "%";
                        document.getElementById('upSpd').innerText = speed + " KB/s";
                    };

                    xhr.onload = () => {
                        if (xhr.status < 300) {
                            const newItem = JSON.parse(xhr.responseText).content;
                            db.unshift(newItem);
                            render(db);
                            updateStats();
                            log("success", `UPLOAD_COMPLETE: ${file.name}`);
                        }
                        setTimeout(() => overlay.classList.add('hidden'), 1000);
                    };
                    xhr.send(JSON.stringify({ message: "Cloud Pro Upload", content: b64 }));
                };
            });
        }

        function closeAllViewers() {
            document.querySelectorAll('.viewer-overlay').forEach(el => el.style.display = 'none');
            if(vjsPlayer) { vjsPlayer.dispose(); vjsPlayer = null; }
            document.getElementById('audioEl').pause();
            document.getElementById('audioEl').src = "";
            document.getElementById('imgEl').src = "";
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarBackdrop').classList.toggle('active');
        }

        function updateStats() {
            const bytes = db.reduce((a, f) => a + f.size, 0);
            const mb = (bytes / (1024 * 1024)).toFixed(2);
            document.getElementById('storageUsed').innerText = mb + " MB";
            const pc = Math.min((bytes / (100 * 1024 * 1024)) * 100, 100);
            document.getElementById('storageBar').style.width = pc + "%";
        }

        function getIcon(ext) {
            const map = { 'mp4': 'fas fa-video text-red-500', 'apk': 'fab fa-android text-green-500', 'pdf': 'fas fa-file-pdf text-orange-500', 'zip': 'fas fa-file-archive text-yellow-600', 'mp3': 'fas fa-music text-pink-500' };
            return map[ext] || 'fas fa-file-alt text-blue-400';
        }

        function log(type, msg) {
            const term = document.getElementById('termux');
            const color = type === 'error' ? '#f87171' : (type === 'success' ? '#4ade80' : '#9ca3af');
            term.innerHTML += `<div><span style="color:#6b7280">[${new Date().toLocaleTimeString()}]</span> <span style="color:${color}">${msg}</span></div>`;
            term.scrollTop = term.scrollHeight;
        }

        function filterBy(type) {
            if(window.innerWidth < 1025) toggleSidebar();
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active-nav'));
            event.currentTarget.classList.add('active-nav');
            if(type === 'all') render(db);
            else {
                render(db.filter(f => {
                    const ext = f.name.split('.').pop().toLowerCase();
                    if(type === 'image') return ['jpg','png','jpeg','webp','gif'].includes(ext);
                    if(type === 'video') return ['mp4','mkv','webm','mov'].includes(ext);
                    if(type === 'audio') return ['mp3','wav','ogg','m4a'].includes(ext);
                    if(type === 'apk') return ext === 'apk';
                }));
            }
        }
    </script>
</body>
</html>
